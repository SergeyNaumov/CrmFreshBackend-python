{%if 0%}
<svg width="300" height="250" xmlns="http://www.w3.org/2000/svg">
    <!-- Фильтр для тени -->
    <defs>
      <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur" />
        <feOffset in="blur" dx="5" dy="5" result="offsetBlur" />
        <feMerge>
          <feMergeNode in="offsetBlur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  
    <!-- Подставка -->
    <rect x="50" y="180" width="200" height="20" fill="#aaa" stroke="#888" stroke-width="1" filter="url(#dropShadow)" />
  
    <!-- Первое место -->
    <defs>
      <linearGradient id="firstPlaceGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffd700" />
        <stop offset="100%" stop-color="#ffcf8c" />
      </linearGradient>
    </defs>
    <rect x="120" y="30" width="60" height="150" fill="url(#firstPlaceGradient)" stroke="#888" stroke-width="1" filter="url(#dropShadow)" />
    <polygon points="120,180 120,170 180,170 180,180" fill="#ccc" />
  
    <!-- Медаль первого места -->
    <circle cx="150" cy="30" r="15" fill="gold" stroke="#888" stroke-width="1" />
    <text x="150" y="34" font-size="12" text-anchor="middle" fill="#593e00" font-weight="bold">1</text>
  
    <text x="150" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#593e00">{{st[0]}}</text>
  
    <!-- Второе место -->
    <defs>
      <linearGradient id="secondPlaceGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c0c0c0" />
        <stop offset="100%" stop-color="#d9d9d9" />
      </linearGradient>
    </defs>
    <rect x="80" y="90" width="60" height="100" fill="url(#secondPlaceGradient)" stroke="#888" stroke-width="1" filter="url(#dropShadow)" />
    <polygon points="80,190 80,180 140,180 140,190" fill="#ddd" />
  
    <!-- Медаль второго места -->
    <circle cx="110" cy="90" r="15" fill="silver" stroke="#888" stroke-width="1" />
    <text x="110" y="95" font-size="12" text-anchor="middle" fill="#555555" font-weight="bold">2</text>
  
    <text x="110" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#555555">{{st[1]}}</text>
  
    <!-- Третье место -->
    <defs>
      <linearGradient id="thirdPlaceGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#cd7f32" />
        <stop offset="100%" stop-color="#d2b48c" />
      </linearGradient>
    </defs>
    <rect x="160" y="110" width="60" height="80" fill="url(#thirdPlaceGradient)" stroke="#888" stroke-width="1" filter="url(#dropShadow)" />
    <polygon points="160,190 160,180 220,180 220,190" fill="#e0c9a9" />
  
    <!-- Медаль третьего места -->
    <circle cx="190" cy="110" r="15" fill="brown" stroke="#888" stroke-width="1" />
    <text x="190" y="115" font-size="12" text-anchor="middle" fill="#fafafa" font-weight="bold">3</text>
  
    <text x="190" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#fafafa">{{st[2]}}</text>
  </svg>
  {%else%}
  <svg width="300" height="250" xmlns="http://www.w3.org/2000/svg">
    <!-- Фильтр для тени -->
    <defs>
      <filter id="circleDropShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" /> <!-- Увеличили размытие -->
        <feOffset in="blur" dx="4" dy="4" result="offsetBlur" /> <!-- Увеличили смещение -->
        <feComposite in="offsetBlur" in2="SourceAlpha" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
